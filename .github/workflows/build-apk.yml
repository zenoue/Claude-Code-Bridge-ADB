name: Build APK

# Chỉ build APK + tạo release khi phần vỏ APK đổi (app/, api/, cấu hình Gradle) hoặc bấm chạy tay.
# Đổi code chức năng (feature/) -> workflow "Live update" lo, không tạo release.
on:
  push:
    branches: [main_1]
    paths:
      - 'app/**'
      - 'api/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main_1
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # cần lịch sử + tag để viết ghi chú, số commit làm phiên bản chức năng

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Version
        run: |
          echo "FEATURE_VERSION=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v1.0.${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Unit test
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build APK
        run: ./gradlew --no-daemon assembleDebug

      # feature.json/.dex đính kèm chỉ để APK cũ (≤ v1.0.8, đọc releases/latest) biết có bản mới
      - name: Collect files
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/CCBridgeADB-v1.0.${{ github.run_number }}.apk"
          cp feature/build/outputs/feature/feature.dex feature/build/outputs/feature/feature.json out/

      # Ghi chú vắn tắt: tiêu đề các commit kể từ bản phát hành trước.
      - name: Release notes
        run: |
          PREV=$(git tag --list 'v1.0.*' --sort=-v:refname | head -n1)
          {
            echo "## Cập nhật"
            if [ -n "$PREV" ]; then
              git log --no-merges --pretty='- %s' "$PREV..HEAD"
            else
              git log --no-merges --pretty='- %s' -n 20
            fi
            echo
            echo "Tải file \`.apk\` bên dưới về điện thoại và cài (cài đè được bản cũ). Kèm chức năng #$FEATURE_VERSION;"
            echo "các bản chức năng sau tự cập nhật trong app (Connect → Cập nhật chức năng), không cần cài lại APK."
          } > notes.md
          cat notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: CCBridgeADB-apk
          path: out/*

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body_path: notes.md
          files: |
            out/*.apk
            out/feature.dex
            out/feature.json
