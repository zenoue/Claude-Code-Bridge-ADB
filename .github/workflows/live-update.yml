name: Live update

# Code chức năng (feature/) đổi -> build feature.dex và đẩy lên nhánh `live`.
# App tự tải từ raw.githubusercontent.com/<repo>/live/feature.json – KHÔNG tạo release, không build APK.
on:
  push:
    branches: [main_1]
    paths:
      - 'feature/**'
      - 'api/**'
      - '.github/workflows/live-update.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-update
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # số phiên bản = số commit

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Version
        run: |
          echo "FEATURE_VERSION=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      - name: Unit test + feature.dex
        run: ./gradlew --no-daemon :feature:testDebugUnitTest :feature:featureDex

      - name: Publish to branch live
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -e
          OUT="$GITHUB_WORKSPACE/feature/build/outputs/feature"
          WT="$RUNNER_TEMP/live"
          rm -rf "$WT" && mkdir -p "$WT"
          # giữ bản dex trước + bản mới (app đọc feature.json cũ trong cache CDN ~5 phút vẫn tải được)
          if git ls-remote --exit-code origin live >/dev/null 2>&1; then
            git fetch -q origin live
            git archive FETCH_HEAD | tar -x -C "$WT"
          fi
          cd "$WT"
          ls feature-*.dex 2>/dev/null | sort -V | head -n -1 | xargs -r rm -f
          cp "$OUT/feature.dex" "feature-$FEATURE_VERSION.dex"
          cp "$OUT/feature.json" feature.json
          printf '# Live update\n\nNhánh do CI tạo tự động – app tải `feature.json` + `feature-N.dex` ở đây. Đừng sửa tay.\n' > README.md
          cat feature.json
          git init -q -b live
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Live #$FEATURE_VERSION: $(git -C "$GITHUB_WORKSPACE" log -1 --pretty=%s)"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:live
          echo "### Live update #$FEATURE_VERSION" >> "$GITHUB_STEP_SUMMARY"
          git -C "$GITHUB_WORKSPACE" log -1 --pretty=%s >> "$GITHUB_STEP_SUMMARY"
